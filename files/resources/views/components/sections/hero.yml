# The visual editor's contract for hero.blade.php.
# The tabs come from the workbench collection and the screen beneath them is
# components/mocks/console.blade.php — its own fields cover the window.
title: Hero
description: The iridescent opening — two-line serif headline, one paragraph, the pill button, the task tabs and the console window
fields:
    heading:
        type: text
        label: Headline, first line
        default: "One key."
    headingTwo:
        type: text
        label: Headline, second line
        default: "Every model."
    body:
        type: textarea
        label: One paragraph
        rows: 3
        default: "Prism gives engineering teams one OpenAI-compatible endpoint in front of every model, and a log that says why each request went where it went."
    ctaText:
        type: text
        label: Button text
        default: "Get an API key"
    ctaLink:
        type: url
        label: Button link
        default: "/docs/quickstart"
    showSecondary:
        type: toggle
        label: Show text link
        default: "1"
    secondaryText:
        type: text
        label: Text link
        default: "See every model"
    secondaryLink:
        type: url
        label: Text link URL
        default: "/models"
    pauseLabel:
        type: text
        label: Pause button label
        description: Read by screen readers and shown on hover.
        default: "Pause the tour"
    workbench:
        type: repeater
        label: Tasks
        description: One tab per task. Edit each screen on the console window below.
        add_button_label: "Add task"
        item_label: label
        sub_fields:
            key:
                type: text
                label: Key
                default: "new-task"
            label:
                type: text
                label: Tab text
                default: "New task"
            icon:
                type: textarea
                label: Icon (SVG)
                description: "Raw SVG, 24×24, class=\"size-4 shrink-0\"."
                rows: 3
                default: ""
